[project]
name = "tp-defensible-space"
version = "0.1.0"
description = "TP Final Vision por Computadora III — Defensible space detection en Villa La Angostura"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "albumentations>=2.0.8",
    "folium>=0.20.0",
    "mobile-sam",
    "pillow>=12.3.0",
    "pycocotools>=2.0.11",
    "rasterio>=1.4.4",
    "roboflow>=1.6.1",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "torch",
    "torchvision",
    "transformers>=5.17.0",
    "ultralytics>=8.4.159",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
mobile-sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git" }
